
spring.application.name=order-worker

server.port=8083

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}

app.kafka.orders-topic=orders.created.v1

spring.kafka.consumer.group-id=order-processing-v1
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false

spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.value.default.type=com.example.orders.contract.kafka.events.OrderCreatedEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.orders.contract
spring.kafka.consumer.properties.spring.json.use.type.headers=false

spring.kafka.listener.ack-mode=record
spring.kafka.listener.concurrency=3
spring.kafka.listener.missing-topics-fatal=true

app.kafka.orders-dlt-topic=orders.created.v1.dlt

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true

spring.datasource.url=jdbc:h2:file:./data/order-worker
spring.datasource.username=alizadeh
spring.datasource.password=

spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=none

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false